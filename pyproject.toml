[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amazon-scraper"
version = "0.1.0"
description = "Amazon scraper in Python: products, reviews, sellers and search as JSON, on the Bright Data Amazon Scraper API (Web Scraper API). No login, no browser. 5,000 free credits a month."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["brightdata-sdk>=2.5.2,<3", "rich>=13,<16"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
amazon-scraper = "amazon_scraper.__main__:main"

[project.urls]
Homepage = "https://github.com/brightdata/amazon-scraper-python"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_scraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
